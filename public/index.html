<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Todo Workplace</title>
    <!-- CDN Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Todo Workplace</h1>
            <p class="text-sm text-slate-400 mt-2">Masuk untuk mengelola tugas harianmu.</p>
        </div>

        <!-- Login Card -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 md:p-8 shadow-xl">
            <!-- Tambahkan id="loginForm" pada tag form -->
            <form id="loginForm" class="space-y-5">
                <!-- Email -->
                <div class="space-y-2">
                    <label for="email" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Email Address</label>
                    <input type="email" id="email" required placeholder="name@example.com"
                        class="bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-lg px-4 py-3 w-full focus:outline-none focus:border-blue-500 transition" />
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label for="password" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
                        <a href="#" class="text-xs text-blue-500 hover:text-blue-400">Lupa password?</a>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-lg px-4 py-3 w-full focus:outline-none focus:border-blue-500 transition" />
                </div>

                <!-- Remember Me -->
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-blue-500" />
                    <label for="remember" class="text-xs text-slate-400">Ingat saya di perangkat ini</label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm py-3 rounded-lg transition active:scale-[0.98] shadow-lg shadow-blue-900/20">
                    Masuk Sekarang
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-700/50"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-slate-800 px-2 text-slate-500">Atau</span>
                </div>
            </div>

            <!-- Register Link -->
            <p class="text-center text-sm text-slate-400">
                Belum punya akun? 
                <a href="register.html" class="text-teal-400 hover:text-teal-300 font-medium transition">Daftar gratis</a>
            </p>
        </div>

        <!-- Footer -->
        <p class="text-center mt-8 text-xs text-slate-500">
            &copy; 2026 Todo Workplace. Built by Satria Farel.
        </p>
    </div>

    <!-- SCRIPT JAVASCRIPT UNTUK KONEK KE API GO -->
    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault(); // Mencegah halaman reload otomatis

            // Ambil nilai dari inputan email & password
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Ubah tombol jadi teks "Memproses..." biar keren
            submitBtn.disabled = true;
            submitBtn.innerText = "Memproses...";

            try {
                // KIRIM DATA KE BACKEND GO (Ganti URL dengan domain Vercel kamu nanti)
                // Kalau masih dicoba di lokal, ganti jadi "http://localhost:8080/api/login"
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.message || "Login Berhasil!");
                    // Contoh kalau sukses, lempar ke halaman dashboard task
                    window.location.href = "home.html"; 
                } else {
                    alert(data.error || "Gagal login, periksa kembali email & password!");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Terjadi kesalahan koneksi ke server.");
            } finally {
                // Kembalikan tombol seperti semula
                submitBtn.disabled = false;
                submitBtn.innerText = "Masuk Sekarang";
            }
        });
    </script>
</body>

</html>
