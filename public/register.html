<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - Todo Workplace</title>
    <!-- CDN Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-md my-8">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white tracking-tight">Todo Workplace</h1>
            <p class="text-sm text-slate-400 mt-2">Mulai kelola produktivitasmu sekarang.</p>
        </div>

        <!-- Register Card -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 md:p-8 shadow-xl">
            <!-- Tambahkan id="registerForm" pada tag form -->
            <form id="registerForm" class="space-y-4">
                <!-- Name -->
                <div class="space-y-2">
                    <label for="name" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Nama
                        Lengkap</label>
                    <input type="text" id="name" required placeholder="Satria Farel"
                        class="bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-lg px-4 py-3 w-full focus:outline-none focus:border-blue-500 transition" />
                </div>

                <!-- Email -->
                <div class="space-y-2">
                    <label for="email" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Email
                        Address</label>
                    <input type="email" id="email" required placeholder="name@example.com"
                        class="bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-lg px-4 py-3 w-full focus:outline-none focus:border-blue-500 transition" />
                </div>

                <!-- Password -->
                <div class="space-y-2">
                    <label for="password"
                        class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-lg px-4 py-3 w-full focus:outline-none focus:border-blue-500 transition" />
                    <p class="text-[10px] text-slate-500 italic">Minimal 8 karakter dengan kombinasi angka.</p>
                </div>

                <!-- Confirm Password -->
                <div class="space-y-2">
                    <label for="confirm-password"
                        class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Konfirmasi
                        Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••"
                        class="bg-slate-900 border border-slate-700 text-sm text-slate-100 rounded-lg px-4 py-3 w-full focus:outline-none focus:border-blue-500 transition" />
                </div>

                <!-- Terms -->
                <div class="flex items-start gap-2 pt-2">
                    <input type="checkbox" id="terms" required
                        class="mt-1 w-4 h-4 rounded border-slate-700 bg-slate-900 text-blue-600 focus:ring-blue-500" />
                    <label for="terms" class="text-xs text-slate-400 leading-relaxed">
                        Saya setuju dengan <a href="#" class="text-blue-500 hover:underline">Ketentuan Layanan</a> dan
                        <a href="#" class="text-blue-500 hover:underline">Kebijakan Privasi</a>.
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold text-sm py-3 rounded-lg transition active:scale-[0.98] shadow-lg shadow-blue-900/20 mt-2">
                    Buat Akun
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-700/50"></div>
                </div>
                <div class="relative flex justify-center text-xs uppercase">
                    <span class="bg-slate-800 px-2 text-slate-500">Atau</span>
                </div>
            </div>

            <!-- Login Link -->
            <p class="text-center text-sm text-slate-400">
                Sudah punya akun?
                <a href="index.html" class="text-teal-400 hover:text-teal-300 font-medium transition">Masuk di sini</a>
            </p>
        </div>

        <!-- Footer -->
        <p class="text-center mt-8 text-xs text-slate-500">
            &copy; 2026 Todo Workplace. Built by Satria Farel.
        </p>
    </div>

    <!-- SCRIPT JAVASCRIPT UNTUK KIRIM DATA KE BACKEND GO -->
    <script>
        const registerForm = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');

        registerForm.addEventListener('submit', async function (e) {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert("Konfirmasi password tidak sama!");
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Membuat Akun...";

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                // 1. Ambil respon sebagai teks biasa dulu untuk berjaga-jaga
                const responseText = await response.text();

                // 2. Coba ubah teksnya jadi JSON
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (err) {
                    // Kalau server ngasih balasan selain JSON (contohnya error HTML Vercel)
                    console.error("Respon Server Bukan JSON:", responseText);
                    alert("Terjadi kesalahan di server (Cek Console F12 untuk detailnya).");
                    return;
                }

                if (response.ok) {
                    alert(data.message || "Pendaftaran Berhasil!");
                    window.location.href = "index.html";
                } else {
                    alert(data.error || "Gagal mendaftar, silakan coba lagi.");
                }
            } catch (error) {
                console.error('Error:', error);
                alert("Terjadi kesalahan koneksi ke server.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Buat Akun";
            }
        });
    </script>
</body>

</html>
